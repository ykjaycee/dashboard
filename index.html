            <h1>YKJAYCEE</h1>
            <textarea class="desc" disabled>
Welcome to my space on the web! I’m Jaycee, a passionate developer, dedicated student, and creative writer. This site serves as a live document of my journey—where code, words, and curiosity intersect. Here, you'll find everything from my technical projects and academic work to personal essays, reflections, and insights into who I am beyond the screen. Take a look around to see what I’m building, what I’m learning, and where I’m headed next!
            </textarea>
            <h1>WHAT IS MY MAJOR?</h1>
            <textarea class="desc" disabled>
I am currently a first-year college student majoring in Web Development. While I’m actively keeping an open mind and exploring other potential specializations in tech, my current focus is on building a solid foundation. Alongside my web design and development coursework, I'm diving deep into C++ to sharpen my problem-solving skills and better understand low-level programming concepts from the ground up.
            </textarea>
            <h1>WHAT ARE MY HOBBIES?</h1>
            <textarea class="desc" disabled="disabled">
Outside of my academic and technical pursuits, I’m deeply passionate about gaming, especially in the competitive scene, where I thrive on strategy, quick decision-making, and high-stakes teamwork. But my creativity doesn't stop at screen mechanics—I’m also driven by world-building and artistic expression. Whether I'm crafting narrative-driven stories, composing original music, or writing clean code, I love bringing ideas to life from scratch and sharing my skills and creations with the world.
            </textarea>
        </div>

        <tag id="info"></tag>
        <div class="contentCase">
            <h1>PURPOSE</h1>
            <textarea class="desc" disabled="disabled">
The main purpose of this platform is to document and share my growing portfolio of work with the world. Here, you’ll find a showcase of my personal projects, including software applications, original digital artwork, writing, book releases, video content, and ongoing development updates. This space is both a living archive of my achievements and a window into my creative process. I hope these projects resonate with you, and I’m genuinely excited to see where this journey takes me.
            </textarea>
            <h1>BILLS AND PAYMENTS</h1>
            <textarea class="desc" disabled="disabled">
No hidden costs, no premium tiers, and no subscriptions. Everything provided on this site—from applications and games to written content—is completely free for you to visit, download, and enjoy. Your support by visiting and using my creations is all the appreciation I need!
            </textarea>
        </div>

            <h1>MAIN PARTS OF THIS WEB</h1>
            <br>
            <h2>1. Gallery</h2>
            <textarea class="desc" disabled="disabled">
This gallery serves as a visual timeline of my growth, progress, and accomplishments. I use this space to keep everything organized in one place—sharing photos of key milestones, sneak peeks of upcoming projects, and regular updates on what I’m working on right now. Take a look around to follow along with my journey!
            </textarea>
            <h2>2. Library</h2>
            <textarea class="desc" disabled="disabled">
This is the dedicated home for all my written works, storytelling updates, and published projects. Here, you’ll find news, chapter releases, and status updates regarding my stories and books across platforms like Wattpad, Facebook, and beyond. Whether you're a long-time reader or discovering my worlds for the first time, explore this space to stay up to date with my latest writings.
            </textarea>
            <h2>3. Apps (Web, Android, Windows)</h2>
            <textarea class="desc" disabled="disabled">
Here is where I display my finished and ongoing software projects across Web, Android, and Windows platforms. Whether it's a lightweight web app or a full desktop client, each entry includes project details, live demos, source code, and release updates. I'm constantly learning and expanding my toolkit, with support for additional platforms coming soon!
            </textarea>
            <h2>4. Playground</h2>
            <textarea class="desc" disabled="disabled">
Welcome to the Playground! This is an interactive arena where you can test out some of the web games and mini-applications I've built. From classic arcade favorites like Snake to speed-focused typing tests and custom interactive tools, feel free to dive in, play around, and test your skills—no downloads required.
            </textarea>
